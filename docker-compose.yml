services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: citea
      POSTGRES_PASSWORD: citea
      POSTGRES_DB: citea
    ports:
      - "5433:5432"        # 5433 para no chocar con nada en tu 5432
    tmpfs:
      - /var/lib/postgresql/data   # datos en RAM: se borran al reiniciar